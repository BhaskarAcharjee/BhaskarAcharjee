<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Mesh -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="45%" stop-color="#0b1328"/>
      <stop offset="80%" stop-color="#0d1b3a"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Glowing Ambient Radial Lights -->
    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-indigo" cx="85%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-fuchsia" cx="50%" cy="95%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>

    <!-- Animated Shimmer Gradient for Title -->
    <linearGradient id="animated-title-grad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glass Capsule Fill -->
    <linearGradient id="capsule-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1"/>
      <circle cx="38" cy="0" r="1.4" fill="#38bdf8" fill-opacity="0.09"/>
    </pattern>

    <!-- Keyframe Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes spinCW {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.2); }
      }
      @keyframes circuitDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes eqBar1 {
        0%, 100% { height: 6px; y: 22px; }
        50% { height: 24px; y: 4px; }
      }
      @keyframes eqBar2 {
        0%, 100% { height: 26px; y: 2px; }
        50% { height: 10px; y: 18px; }
      }
      @keyframes eqBar3 {
        0%, 100% { height: 14px; y: 14px; }
        50% { height: 28px; y: 0px; }
      }
      @keyframes eqBar4 {
        0%, 100% { height: 22px; y: 6px; }
        50% { height: 8px; y: 20px; }
      }
      @keyframes eqBar5 {
        0%, 100% { height: 10px; y: 18px; }
        50% { height: 25px; y: 3px; }
      }
      .floating-card {
        animation: floatSlow 4s infinite ease-in-out;
      }
      .spin-clockwise {
        animation: spinCW 25s linear infinite;
        transform-origin: 1010px 220px;
      }
      .spin-counter {
        animation: spinCCW 18s linear infinite;
        transform-origin: 1010px 220px;
      }
      .circuit-flow {
        stroke-dasharray: 20 180;
        animation: circuitDash 3s linear infinite;
      }
      .live-dot {
        animation: pulseLight 2s infinite ease-in-out;
        transform-origin: 322px 352px;
      }
      .bar-1 { animation: eqBar1 1.2s infinite ease-in-out; }
      .bar-2 { animation: eqBar2 1.4s infinite ease-in-out; }
      .bar-3 { animation: eqBar3 0.9s infinite ease-in-out; }
      .bar-4 { animation: eqBar4 1.1s infinite ease-in-out; }
      .bar-5 { animation: eqBar5 1.3s infinite ease-in-out; }

      .font-sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
      .font-heading {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.8px;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="440" rx="22" fill="url(#bg-grad)"/>
  <rect width="1200" height="440" rx="22" fill="url(#cyber-grid)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="440" rx="22" fill="url(#glow-cyan)"/>
  <rect width="1200" height="440" rx="22" fill="url(#glow-indigo)"/>
  <rect width="1200" height="440" rx="22" fill="url(#glow-fuchsia)"/>

  <!-- Neon Frame Border -->
  <rect x="2" y="2" width="1196" height="436" rx="20" fill="none" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- ========================================================================= -->
  <!-- ANIMATED SCI-FI ROTATING RINGS (BACKGROUND RIGHT)                          -->
  <!-- ========================================================================= -->
  <g class="spin-clockwise" opacity="0.35">
    <circle cx="1010" cy="220" r="145" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="14 12"/>
    <circle cx="1010" cy="220" r="115" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="40 20"/>
    <circle cx="1010" cy="75" r="4" fill="#38bdf8"/>
    <circle cx="1010" cy="365" r="4" fill="#6366f1"/>
  </g>

  <g class="spin-counter" opacity="0.25">
    <circle cx="1010" cy="220" r="175" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="8 18"/>
    <circle cx="1010" cy="220" r="90" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="10 25"/>
    <polygon points="1010,45 1014,53 1006,53" fill="#c084fc"/>
    <polygon points="1010,395 1014,387 1006,387" fill="#c084fc"/>
  </g>

  <!-- ========================================================================= -->
  <!-- ANIMATED CYBER CIRCUIT TRACES                                             -->
  <!-- ========================================================================= -->
  <!-- Circuit Line 1 -->
  <path d="M 60 40 L 400 40 L 440 80 L 780 80" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 60 40 L 400 40 L 440 80 L 780 80" fill="none" stroke="#38bdf8" stroke-width="2.5" class="circuit-flow"/>

  <!-- Circuit Line 2 -->
  <path d="M 60 400 L 320 400 L 360 360 L 680 360" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 60 400 L 320 400 L 360 360 L 680 360" fill="none" stroke="#c084fc" stroke-width="2.5" class="circuit-flow" style="animation-duration: 4s;"/>

  <!-- ========================================================================= -->
  <!-- TOP CAPSULES / STATUS BADGES                                              -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 42)">
    <!-- Badge 1: TCS -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="url(#capsule-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="16" r="4.5" fill="#38bdf8"/>
    <text x="28" y="20.5" class="font-mono" font-size="11.5" font-weight="700" fill="#bae6fd" letter-spacing="0.6">JAVA BACKEND @ TCS</text>

    <!-- Badge 2: Apps -->
    <rect x="232" y="0" width="215" height="32" rx="16" fill="url(#capsule-grad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="248" cy="16" r="4.5" fill="#818cf8"/>
    <text x="260" y="20.5" class="font-mono" font-size="11.5" font-weight="700" fill="#c7d2fe" letter-spacing="0.6">5+ PLAY STORE APPS</text>

    <!-- Badge 3: JGEC ECE -->
    <rect x="459" y="0" width="180" height="32" rx="16" fill="url(#capsule-grad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="475" cy="16" r="4.5" fill="#c084fc"/>
    <text x="487" y="20.5" class="font-mono" font-size="11.5" font-weight="700" fill="#e9d5ff" letter-spacing="0.6">B.TECH ECE • JGEC</text>

    <!-- Badge 4: Location -->
    <rect x="651" y="0" width="150" height="32" rx="16" fill="url(#capsule-grad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="667" cy="16" r="4.5" fill="#34d399"/>
    <text x="679" y="20.5" class="font-mono" font-size="11.5" font-weight="700" fill="#a7f3d0" letter-spacing="0.6">KOLKATA, IN</text>
  </g>

  <!-- ========================================================================= -->
  <!-- MAIN HERO TEXT & BRANDING (LEFT)                                          -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 115)">
    <!-- Subtitle Pre-heading with Cyber Prompt -->
    <g transform="translate(0, 18)">
      <rect x="0" y="-14" width="24" height="20" rx="4" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="6" y="0" class="font-mono" font-size="13" font-weight="800" fill="#38bdf8">&gt;_</text>
      <text x="32" y="0" class="font-mono" font-size="14.5" font-weight="700" fill="#38bdf8" letter-spacing="2.5">
        PORTFOLIO_SYSTEMS // INITIALIZED
      </text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="86" class="font-heading" font-size="60" fill="url(#animated-title-grad)">
      BHASKAR ACHARJEE
    </text>

    <!-- Professional Tagline -->
    <text x="0" y="130" class="font-sans" font-size="20.5" font-weight="600" fill="#e2e8f0" letter-spacing="0.3">
      Java Backend Specialist • Mobile App Craftsman • System Architect
    </text>

    <!-- Description -->
    <text x="0" y="160" class="font-sans" font-size="15" font-weight="400" fill="#94a3b8">
      Designing robust distributed enterprise backends &amp; reactive Android applications with clean architecture.
    </text>

    <!-- Tech Ribbon Strip -->
    <g transform="translate(0, 196)">
      <!-- Java 21 -->
      <rect x="0" y="0" width="90" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="45" y="19" class="font-sans" font-size="12.5" font-weight="700" fill="#7dd3fc" text-anchor="middle">☕ Java 21</text>

      <!-- Spring Boot -->
      <rect x="100" y="0" width="124" height="30" rx="15" fill="#0f172a" stroke="#4ade80" stroke-opacity="0.5"/>
      <text x="162" y="19" class="font-sans" font-size="12.5" font-weight="700" fill="#86efac" text-anchor="middle">🌱 Spring Boot</text>

      <!-- Kotlin -->
      <rect x="234" y="0" width="102" height="30" rx="15" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="285" y="19" class="font-sans" font-size="12.5" font-weight="700" fill="#d8b4fe" text-anchor="middle">📱 Kotlin</text>

      <!-- Jetpack Compose -->
      <rect x="346" y="0" width="146" height="30" rx="15" fill="#0f172a" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="419" y="19" class="font-sans" font-size="12.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">🎨 Jetpack Compose</text>

      <!-- Microservices -->
      <rect x="502" y="0" width="138" height="30" rx="15" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="571" y="19" class="font-sans" font-size="12.5" font-weight="700" fill="#fbcfe8" text-anchor="middle">⚡ Microservices</text>

      <!-- Cloud/Docker -->
      <rect x="650" y="0" width="128" height="30" rx="15" fill="#0f172a" stroke="#60a5fa" stroke-opacity="0.5"/>
      <text x="714" y="19" class="font-sans" font-size="12.5" font-weight="700" fill="#93c5fd" text-anchor="middle">🐳 Docker / Cloud</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- FLOATING HOLOGRAPHIC TECH CARD (RIGHT)                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(865, 88)" class="floating-card">
    <!-- Card Base with Glassmorphism -->
    <rect width="275" height="255" rx="18" fill="#0b1122" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.6"/>
    
    <!-- Window Dots Header -->
    <circle cx="22" cy="22" r="5" fill="#ef4444"/>
    <circle cx="38" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="22" r="5" fill="#10b981"/>
    <text x="75" y="26" class="font-mono" font-size="11" fill="#64748b">core_manifest.json</text>
    
    <!-- Mini Equalizer in Header (MelodyMorph touch!) -->
    <g transform="translate(210, 8)">
      <rect x="0" y="8" width="3.5" height="18" rx="1.5" fill="#38bdf8" class="bar-1"/>
      <rect x="6" y="8" width="3.5" height="18" rx="1.5" fill="#818cf8" class="bar-2"/>
      <rect x="12" y="8" width="3.5" height="18" rx="1.5" fill="#c084fc" class="bar-3"/>
      <rect x="18" y="8" width="3.5" height="18" rx="1.5" fill="#34d399" class="bar-4"/>
      <rect x="24" y="8" width="3.5" height="18" rx="1.5" fill="#f472b6" class="bar-5"/>
    </g>

    <line x1="0" y1="42" x2="275" y2="42" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Code Block in Terminal Card -->
    <g transform="translate(18, 62)" class="font-mono" font-size="11.8">
      <text y="0" fill="#94a3b8">{</text>
      <text y="20" fill="#7dd3fc" x="12">"status"<tspan fill="#94a3b8">: </tspan><tspan fill="#34d399">"Innovating"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text y="40" fill="#7dd3fc" x="12">"company"<tspan fill="#94a3b8">: </tspan><tspan fill="#fbcfe8">"TCS"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text y="60" fill="#7dd3fc" x="12">"playStoreApps"<tspan fill="#94a3b8">: </tspan><tspan fill="#fcd34d">5</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text y="80" fill="#7dd3fc" x="12">"coreStack"<tspan fill="#94a3b8">: [</tspan><tspan fill="#a5b4fc">"Java"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#a5b4fc">"Kotlin"</tspan><tspan fill="#94a3b8">],</tspan></text>
      <text y="100" fill="#7dd3fc" x="12">"microservices"<tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">true</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text y="120" fill="#7dd3fc" x="12">"openSource"<tspan fill="#94a3b8">: </tspan><tspan fill="#38bdf8">"Active"</tspan></text>
      <text y="140" fill="#94a3b8">}</text>
    </g>

    <!-- Mini Bottom Status Bar -->
    <rect x="14" y="212" width="247" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="30" cy="226" r="4.5" fill="#10b981" class="live-dot"/>
    <text x="44" y="230" class="font-mono" font-size="10.8" font-weight="700" fill="#86efac">Ready for collaboration</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <line x1="60" y1="412" x2="1140" y2="412" stroke="url(#border-grad)" stroke-width="1.2" stroke-opacity="0.6"/>
</svg>
