<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="80">
  <defs>
    <filter id="glow-logo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff007f" flood-opacity="0.9"/>
    </filter>
    <style>
      .box {
        fill: #340944;
        stroke: #ff007f;
        stroke-width: 2.2;
        filter: url(#glow-logo);
      }
      .logo-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 26px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 1.5px;
      }
      .bracket {
        fill: #ff2a85;
      }
    </style>
  </defs>

  <rect width="240" height="80" fill="#0d1117"/>

  <g transform="translate(10, 8)">
    <rect width="220" height="64" rx="16" class="box"/>
    <!-- Cyber Logo Monogram -->
    <text x="110" y="42" text-anchor="middle" class="logo-text">
      <tspan class="bracket">&lt;</tspan>BA<tspan class="bracket">/&gt;</tspan>
    </text>
  </g>
</svg>
