<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="100%" height="80">
  <defs>
    <filter id="glow-nav" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#e0288d" flood-opacity="0.8"/>
    </filter>
    <style>
      .box {
        fill: #270634;
        stroke: #e0288d;
        stroke-width: 1.8;
        filter: url(#glow-nav);
        transition: all 0.3s ease;
      }
      .label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 17px;
        font-weight: 600;
        fill: #ffc6ac;
      }
      .icon-path {
        fill: #ffc6ac;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="220" height="80" fill="#0d1117"/>

  <!-- Glowing Neon Pill -->
  <g transform="translate(10, 8)">
    <rect width="200" height="64" rx="16" class="box"/>
    <!-- X/Twitter Icon -->
    <g transform="translate(24, 18) scale(0.6)">
      <path class="icon-path" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </g>
    <!-- Label -->
    <text x="82" y="38" class="label">𝕏 / Twitter</text>
  </g>
</svg>
