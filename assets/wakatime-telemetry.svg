<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
<defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .heading { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes pulseBar {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.7; }
    }
    .pulsing-bar {
      animation: pulseBar 3s infinite ease-in-out;
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .pulse-dot {
      animation: pulseLive 2s infinite ease-in-out;
      transform-origin: 1146px 33px;
    }
  </style>

  <linearGradient id="waka-hairline" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3d93ff" stop-opacity=".6"/>
    <stop offset="50%" stop-color="#1f3760" stop-opacity=".3"/>
    <stop offset="100%" stop-color="#ff354f" stop-opacity=".5"/>
  </linearGradient>

  <pattern id="waka-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#2d4a73" fill-opacity=".25"/>
  </pattern>
</defs>

<rect width="1200" height="440" rx="22" fill="#070b16" stroke="url(#waka-hairline)" stroke-width="1.8"/>
<rect width="1200" height="440" rx="22" fill="url(#waka-dots)"/>

<!-- Header -->
<path d="M42 56 L1158 56" fill="none" stroke="#223149" stroke-width="1.5"/>
<text x="44" y="36" font-size="11" fill="#8e9db9" class="mono" letter-spacing="1.6">04 / DEVELOPMENT TELEMETRY</text>
<text x="360" y="36" font-size="11" fill="#8e9db9" class="mono" letter-spacing="1.6">WAKATIME TIME MATRIX</text>

<!-- Live Badge -->
<rect x="910" y="20" width="248" height="26" rx="6" fill="#132a47" stroke="#1f3d65" stroke-width="1.2"/>
<text x="924" y="37" font-size="10" fill="#38bdf8" class="mono" font-weight="700">LIVE SYNC // WAKATIME @BHASKAR</text>
<circle cx="1144" cy="33" r="4" fill="#38bdf8" class="pulse-dot"/>

<text x="44" y="100" font-size="32" fill="#f2f5ff" class="heading">MEASURED DISCIPLINE. CODING VELOCITY.</text>
<text x="44" y="122" font-size="11" fill="#7a96bb" class="mono" letter-spacing="1.4">2,500+ TRACKED HOURS ACROSS KOTLIN, JAVASCRIPT, JAVA &amp; ANDROID ARCHITECTURE</text>

<!-- Left 3 Key Metric Counters -->
<g transform="translate(44, 150)">
  <!-- Counter 1: Total Hours -->
  <g transform="translate(0, 0)">
    <rect width="210" height="105" rx="10" fill="#0d182b" stroke="#25436a" stroke-width="1.4"/>
    <text x="18" y="28" font-size="9.5" fill="#7d99be" class="mono">TOTAL TRACKED CODE</text>
    <text x="18" y="72" font-size="36" fill="#38bdf8" class="heading">2,500<tspan font-size="18" fill="#7ba5d6">h+</tspan></text>
    <text x="18" y="94" font-size="9" fill="#58779c" class="mono">ALL-TIME VERIFIED LOG</text>
  </g>

  <!-- Counter 2: Daily Velocity -->
  <g transform="translate(0, 120)">
    <rect width="210" height="105" rx="10" fill="#0d182b" stroke="#25436a" stroke-width="1.4"/>
    <text x="18" y="28" font-size="9.5" fill="#7d99be" class="mono">PRIMARY STACK</text>
    <text x="18" y="72" font-size="34" fill="#ff354f" class="heading">2,122<tspan font-size="18" fill="#ff7a8f">h</tspan></text>
    <text x="18" y="94" font-size="9" fill="#58779c" class="mono">KOTLIN / ANDROID APPS</text>
  </g>
</g>

<!-- Right: Language Distribution Progress Bars -->
<g transform="translate(285, 150)">
  <rect width="870" height="225" rx="12" fill="#0b1424" stroke="#203859" stroke-width="1.4"/>

  <text x="28" y="32" font-size="10.5" fill="#7b97bd" class="mono" letter-spacing="1.4">LANGUAGE &amp; STACK BREAKDOWN // VERIFIED TELEMETRY</text>

  <!-- Bar 1: Kotlin (83.0%) -->
  <g transform="translate(28, 48)">
    <text x="0" y="0" font-size="13" fill="#ffffff" class="heading">Kotlin</text>
    <text x="60" y="0" font-size="12" fill="#7a97bd" class="mono">(Android Architecture, Jetpack &amp; Apps)</text>
    <text x="740" y="0" font-size="14" fill="#ff354f" class="heading">2,122 hrs · 83.0%</text>
    <rect y="10" width="814" height="12" rx="4" fill="#13253d"/>
    <rect y="10" width="675" height="12" rx="4" fill="#ff354f" class="pulsing-bar"/>
  </g>

  <!-- Bar 2: JavaScript (8.3%) -->
  <g transform="translate(28, 92)">
    <text x="0" y="0" font-size="13" fill="#ffffff" class="heading">JavaScript</text>
    <text x="90" y="0" font-size="12" fill="#7a97bd" class="mono">(Fullstack &amp; Interactive Web Engines)</text>
    <text x="740" y="0" font-size="14" fill="#38bdf8" class="heading">211 hrs · 8.3%</text>
    <rect y="10" width="814" height="12" rx="4" fill="#13253d"/>
    <rect y="10" width="168" height="12" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Bar 3: CSS & Web (3.1%) -->
  <g transform="translate(28, 136)">
    <text x="0" y="0" font-size="13" fill="#ffffff" class="heading">CSS / UI</text>
    <text x="70" y="0" font-size="12" fill="#7a97bd" class="mono">(3D Room, Cyber Aesthetics &amp; Animations)</text>
    <text x="740" y="0" font-size="14" fill="#c084fc" class="heading">80 hrs · 3.1%</text>
    <rect y="10" width="814" height="12" rx="4" fill="#13253d"/>
    <rect y="10" width="70" height="12" rx="4" fill="#c084fc"/>
  </g>

  <!-- Bar 4: XML & Layouts (2.7%) -->
  <g transform="translate(28, 180)">
    <text x="0" y="0" font-size="13" fill="#ffffff" class="heading">XML &amp; Layouts</text>
    <text x="120" y="0" font-size="12" fill="#7a97bd" class="mono">(Android View System &amp; Manifests)</text>
    <text x="740" y="0" font-size="14" fill="#247bff" class="heading">68 hrs · 2.7%</text>
    <rect y="10" width="814" height="12" rx="4" fill="#13253d"/>
    <rect y="10" width="55" height="12" rx="4" fill="#247bff"/>
  </g>
</g>

<!-- Footer -->
<text x="44" y="415" font-size="11" fill="#6682a6" class="mono">CONSISTENCY OVER INTENSITY // VERIFIED WAKATIME TELEMETRY</text>
<text x="940" y="415" font-size="11" fill="#38bdf8" class="mono">SYNCED VIA WAKATIME @BHASKAR</text>
</svg>